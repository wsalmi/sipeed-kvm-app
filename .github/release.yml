changelog:
  categories:
    - title: '🚀 Novidades & Funcionalidades / New Features'
      labels:
        - 'feat'
        - 'feature'
        - 'enhancement'
    - title: '🐛 Correções de Bugs / Bug Fixes'
      labels:
        - 'fix'
        - 'bug'
        - 'hotfix'
    - title: '⚡ Performance & Otimizações'
      labels:
        - 'perf'
        - 'performance'
    - title: '🧰 Manutenção & Melhorias / Maintenance'
      labels:
        - 'chore'
        - 'refactor'
        - 'docs'
        - 'ci'
        - 'build'
        - 'dependencies'
