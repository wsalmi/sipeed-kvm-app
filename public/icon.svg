<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Monitor Frame Gradient -->
    <linearGradient id="monitorFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c374a"/>
      <stop offset="100%" stop-color="#1a2230"/>
    </linearGradient>

    <!-- Screen Inner Background -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Cursor Gradient (Vibrant Cyan to Electric Blue) -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadows for Flat Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="cursorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Squircle Base (macOS App Icon Shape) -->
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#bgGrad)"/>
  <rect x="96" y="96" width="832" height="832" rx="188" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.45"/>

  <!-- 2. Monitor Stand -->
  <g filter="url(#shadow)">
    <!-- Base Plate -->
    <rect x="372" y="792" width="280" height="30" rx="15" fill="#242c3d"/>
    <rect x="432" y="795" width="160" height="4" rx="2" fill="#38bdf8" fill-opacity="0.5"/>
    <!-- Stand Neck -->
    <polygon points="464,680 560,680 574,795 450,795" fill="#1b2230"/>
  </g>

  <!-- 3. Monitor Body (Flat Modern Display) -->
  <g filter="url(#shadow)">
    <!-- Outer Bezel -->
    <rect x="142" y="200" width="740" height="490" rx="28" fill="url(#monitorFrame)"/>
    <rect x="142" y="200" width="740" height="490" rx="28" fill="none" stroke="#475569" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Screen Display Area (Width 692, Height 436) -->
    <rect x="166" y="224" width="692" height="436" rx="16" fill="url(#screenBg)"/>
    <rect x="166" y="224" width="692" height="436" rx="16" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.25"/>

    <!-- Subtle Grid pattern inside screen -->
    <line x1="166" y1="333" x2="858" y2="333" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="166" y1="442" x2="858" y2="442" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="166" y1="551" x2="858" y2="551" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="339" y1="224" x2="339" y2="660" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="512" y1="224" x2="512" y2="660" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="685" y1="224" x2="685" y2="660" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>

    <!-- Status LED dot on bottom bezel -->
    <circle cx="512" cy="675" r="4" fill="#00f2fe"/>
  </g>

  <!-- 4. Mouse Pointer Cursor inside Screen Area -->
  <!-- Screen Area is 692 x 436. 60% of Screen Height (436) is ~262px. -->
  <!-- Centered pointer positioned inside the screen -->
  <g transform="translate(412, 276)" filter="url(#cursorShadow)">
    <!-- Classic Cursor Arrow Path, scaled to 262px height (exactly 60% of screen height) -->
    <path d="M 0,0 
             L 0,256 
             L 65,196 
             L 121,310 
             L 166,288 
             L 110,174 
             L 193,174 
             Z" 
          fill="url(#cursorGrad)" 
          stroke="#ffffff" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>
</svg>
